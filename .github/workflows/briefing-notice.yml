name: 오늘 브리핑 최종 결과

"on":
  workflow_run:
    workflows: ['매일 경북대 자료 수집', 'Kaggle GPU 브리핑 생성', '완료된 Kaggle 음성 자동 게시', 'GitHub Pages 배포']
    types: [completed]

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: briefing-final
  cancel-in-progress: false

jobs:
  final:
    if: github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_OWNER: ${{ github.repository_owner }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: 최종 결과 확인 또는 30분 뒤 한 번 게시 재시도
        run: python3 -m tools.briefing_notice
