name: GitHub Pages 배포

"on":
  push:
    branches: [main]
    paths: ['output/app/**', 'assets/bgm/**', 'tools/daily_bgm.py', '.github/workflows/deploy.yml']
  # 수집 워크플로의 자동 커밋은 push 트리거를 시작시키지 않으므로 완료 이벤트로 잇는다.
  workflow_run:
    workflows: ['매일 경북대 자료 수집']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: knu-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      # 새 화면과 그 자료만 올린다. 이전 시험 화면(legacy.html, data.json, details/)은 올리지 않는다.
      - name: 올릴 파일 모으기
        run: mkdir -p site && cp output/app/index.html output/app/privacy.html site/ && cp -R output/app/data site/data
      # 원곡은 공개 저장소·Pages artifact에 포함하지 않는다. 전용 읽기 키로만 가져온다.
      - name: 비공개 YouTube 음악 원본 받기
        uses: actions/checkout@v7
        with:
          repository: jeongwonbahk/knua-youtube-bgm-private
          ref: assets/youtube-20261009
          ssh-key: ${{ secrets.KNUA_BGM_DEPLOY_KEY }}
          persist-credentials: false
          path: .cache/youtube-bgm
      - name: 음성 혼합 도구 확인
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: 하루 음악을 브리핑 음성과 혼합
        env:
          KNUA_BGM_SOURCE_DIR: .cache/youtube-bgm/music
        run: python3 -m tools.daily_bgm --output site/data/bgm --require-source
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: 정적 앱 배포
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # 방금 올린 묶음을 바로 찾지 못해 실패하는 일시 오류가 있어(2026-10-09) 잠시 뒤 한 번만 다시 시도한다.
      - name: 재시도 전 대기
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: 정적 앱 배포 재시도
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
