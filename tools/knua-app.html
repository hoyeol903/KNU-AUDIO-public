  --amber-bg:#FFF0DF;--amber-ink:#8A4700;--amber-line:#F3D3AE;--ok-bg:#E9F5EE;--ok-ink:#1D5D37;--sky-bg:#E8F0FB;--sky-ink:#1F4774;--sky-dot:#4A86D0;--sp-new:#8B1E3F;--sp-due:#9A4F00;--sp-sky:#2D5F99;--sp-ok:#2E6B47;--paper:#FBF8F3;--paper-line:#ECE4D8;

}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);letter-spacing:-.2px;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:none;background:none;padding:0;transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .2s,color .2s}
button:active:not(:disabled),a.pressable:active{transform:scale(.97)}
button:disabled{cursor:not-allowed}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--wine-ink);outline-offset:2px;border-radius:8px}
input::placeholder{color:var(--muted)}
svg{flex-shrink:0}
.num{font-variant-numeric:tabular-nums}

/* stage */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding-block:24px;padding-inline:16px}
.device{position:relative;width:390px;height:min(844px,calc(100vh - 48px));min-height:620px;border-radius:44px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 1px var(--frame),0 40px 90px -40px rgba(60,10,30,.5);flex-shrink:0}
.panel{width:300px;flex-shrink:0;align-self:center;display:flex;flex-direction:column;gap:18px;background:var(--bg);border-radius:28px;padding:22px;box-shadow:0 0 0 1px var(--frame)}
.fab{display:none}
@media (max-width:760px){
  .stage{display:block;padding:0;height:100%;min-height:0}
  .device{width:100%;height:100%;min-height:0;border-radius:0;box-shadow:none}
  .panel{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:82%;overflow-y:auto;border-radius:26px 26px 0 0;z-index:60;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.2,1);box-shadow:0 -20px 60px -20px rgba(0,0,0,.4)}
  .panel.open{transform:none}
  .fab{display:flex;position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:55;height:36px;padding:0 12px;border-radius:999px;align-items:center;gap:6px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:800;opacity:.85}
  .panel-dim{position:fixed;inset:0;background:var(--scrim);z-index:58;display:none}
  .panel-dim.open{display:block}
}
.panel h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.4px}
.panel .lab{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.2px}
.panel .grp{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-radius:12px;background:var(--tile);font-size:14px;font-weight:650;text-align:left;width:100%}
.opt[aria-pressed="true"]{background:var(--wine);color:#fff}
.opt small{margin-left:auto;font-size:11.5px;font-weight:700;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{height:36px;padding:0 12px;border-radius:999px;background:var(--tile);font-size:13px;font-weight:700}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.panel .note{font-size:12.5px;line-height:19px;color:var(--muted);margin:0}

/* screens */
.view{position:absolute;inset:0}
.scr{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:14px 16px 120px}
.scr::-webkit-scrollbar{display:none}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:.4;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.enter .stg>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.enter .stg>*:nth-child(2){animation-delay:.04s}.enter .stg>*:nth-child(3){animation-delay:.08s}.enter .stg>*:nth-child(4){animation-delay:.12s}.enter .stg>*:nth-child(5){animation-delay:.16s}.enter .stg>*:nth-child(6){animation-delay:.2s}.enter .stg>*:nth-child(7){animation-delay:.24s}.enter .stg>*:nth-child(8){animation-delay:.28s}.enter .stg>*:nth-child(9){animation-delay:.32s}.enter .stg>*:nth-child(n+10){animation-delay:.36s}
.push{animation:slideIn .38s cubic-bezier(.2,.8,.2,1) both}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.span2{grid-column:span 2}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.tile{background:var(--tile);border-radius:24px;padding:16px}
.lab-s{font-size:12.5px;font-weight:700;color:var(--muted)}
.h-sec{margin:0;font-size:19px;font-weight:800;letter-spacing:-.4px}
.muted{color:var(--muted)}
.ph{color:var(--ph)!important}
.icon-btn{width:44px;height:44px;border-radius:22px;background:var(--tile);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn.plain{background:transparent}
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:750;white-space:nowrap}
.b-new{background:var(--wine-soft);color:var(--wine-ink)}
.b-due{background:var(--amber-bg);color:var(--amber-ink)}
.b-ok{background:var(--ok-bg);color:var(--ok-ink)}
.b-sky{background:var(--sky-bg);color:var(--sky-ink)}
.b-tile{background:var(--tile);color:var(--ink2)}
.b-bg{background:var(--bg);color:var(--muted)}
.btn-pri{height:56px;width:100%;border-radius:18px;background:var(--wine);color:#fff;font-size:16.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 14px 28px -14px rgba(139,30,63,.7)}
.btn-pri:active:not(:disabled){background:var(--wine-press)}
.btn-pri:disabled{background:var(--tile2);color:var(--dis-ink);box-shadow:none}
.btn-sec{height:48px;padding:0 18px;border-radius:14px;background:var(--tile);font-size:15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.title-wrap{overflow-wrap:anywhere}
.fail{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:6px}
.none{border:1.5px dashed var(--line);border-radius:24px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.wobble{animation:wobble .6s .5s ease-in-out 2}
.bottom-bar{position:absolute;left:0;right:0;bottom:0;padding:14px 18px calc(24px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:5}

.wx{min-height:48px;border-radius:24px;background:var(--tile);padding:8px 8px 8px 16px;display:flex;flex-wrap:wrap;align-items:center;column-gap:10px;row-gap:6px;font-size:15px;min-width:0}
.wx b{font-weight:700;white-space:nowrap}
.wx-ic{color:var(--sky-ink);display:flex}
.wx-dot{width:3px;height:3px;border-radius:2px;background:var(--muted);flex-shrink:0}
.wx-rain{margin-left:auto;height:32px;padding:0 12px;border-radius:999px;background:var(--sky-bg);color:var(--sky-ink);font-size:13px;font-weight:750;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.wx.fail-wx{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink);font-size:14px;column-gap:8px;padding:8px 16px}
.wx.fail-wx b{font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:12px 0}
.stats>*{align-items:center;gap:2px;text-align:center;padding:0 4px}
.stats>*+*{border-left:1px solid var(--line)}
.stats>button{min-height:56px;justify-content:center}
.stats span{font-size:12.5px;font-weight:600;color:var(--muted)}
.stats b{font-size:22px;line-height:28px;font-weight:800}

/* week calendar */
.week{border:1px solid var(--line);border-radius:24px;padding:4px 12px 8px;display:flex;flex-direction:column}
.wk-head{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding-left:4px}
.wk-add{height:44px;padding:0 14px;border-radius:999px;background:var(--tile);font-size:13.5px;font-weight:750;display:inline-flex;align-items:center;gap:5px}
.wk-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:14px 0 6px}
.day{height:64px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day .w{font-size:12px;font-weight:600;color:var(--muted)}
.day .n{font-size:17px;line-height:22px;font-weight:800}
.day .dots{display:flex;gap:3px;height:5px}
.day .dots i{width:5px;height:5px;border-radius:3px}
.d-s{background:var(--sky-dot)}.d-m{background:var(--wine-ink)}
.day.sel{background:var(--ink);color:var(--bg)}
.day.sel .w{color:var(--bg);opacity:.75}
.day.sel .dots i{background:var(--bg)}
.day.today{position:relative;background:var(--wine-soft);justify-content:flex-end;padding-bottom:7px}
.day.today.sel{background:var(--ink)}
.day.today .w{position:absolute;left:50%;top:-15px;width:46px;margin-left:-23px;opacity:1}
.day.today img{display:block;width:46px;height:auto;transform-origin:50% 100%;animation:hop 3.2s ease-in-out infinite}
@keyframes hop{0%,62%,100%{transform:translateY(0) rotate(0)}70%{transform:translateY(-5px) rotate(-6deg)}78%{transform:translateY(0) rotate(4deg)}86%{transform:translateY(-2px) rotate(0)}}
.ev{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 0;border-top:1px solid var(--line);font-size:15px;line-height:21px}
.ev b{flex:1;min-width:0;font-weight:700}
.ev .icon-btn{margin-right:-10px}
.wk-none img{width:42px;height:56px;object-fit:contain;flex-shrink:0;transform-origin:50% 90%;animation:wave 1.8s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
.wk-fail{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0;padding:10px 12px;border-radius:14px;background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink);font-size:13.5px;line-height:19px}
.wk-fail b{font-weight:800}
:root[data-theme="dark"] .day.today img,:root[data-theme="dark"] .wk-none img{filter:drop-shadow(0 0 1px rgba(255,255,255,.55))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .day.today img,:root:not([data-theme="light"]) .wk-none img{filter:drop-shadow(0 0 1px rgba(255,255,255,.55))}}
.sheet.mini{top:auto;max-height:86%}

/* 오늘 학식: 식당마다 메뉴판 카드 한 장, 옆으로 넘겨 본다 */
.mealbox{display:flex;flex-direction:column;min-width:0}
.ml-hd{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 0 0 4px}
.ml-lnk{min-height:44px;padding:0 2px 0 8px;font-size:13.5px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:2px}
.ml-rail{display:flex;align-items:flex-start;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;margin:0 -16px;padding:4px 16px 22px;scrollbar-width:none;overscroll-behavior-x:contain}
.ml-rail::-webkit-scrollbar{display:none}
.mlc{--pc-bg:#F5F5F3;--pc-line:#E3E3DF;--pc-ink:#161616;--pc-ink2:#3D3D3A;--pc-mut:#6B6B66;--pc-kick:#8B1E3F;--pc-seg:#E9E9E5;--pc-segon:#FFFFFF;--pc-sh:rgba(0,0,0,.10)}
:root[data-theme="dark"] .mlc{--pc-bg:#19191B;--pc-line:#2E2E31;--pc-ink:#F2F2F0;--pc-ink2:#CFCFCB;--pc-mut:#9A9A95;--pc-kick:#F2A6BB;--pc-seg:#242427;--pc-segon:#3A3A40;--pc-sh:rgba(0,0,0,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mlc{--pc-bg:#19191B;--pc-line:#2E2E31;--pc-ink:#F2F2F0;--pc-ink2:#CFCFCB;--pc-mut:#9A9A95;--pc-kick:#F2A6BB;--pc-seg:#242427;--pc-segon:#3A3A40;--pc-sh:rgba(0,0,0,.5)}}
.mlc{flex:0 0 calc(100% - 44px);scroll-snap-align:start;box-sizing:border-box;border-radius:26px;background:var(--pc-bg);border:1px solid var(--pc-line);color:var(--pc-ink);padding:20px 20px 12px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px -26px var(--pc-sh)}
.ml-rail>.mlc:only-child{flex-basis:100%}
.mlc-k{font-size:11.5px;font-weight:800;letter-spacing:1.4px;color:var(--pc-kick)}
.mlc-n{font-size:22px;line-height:28px;font-weight:800;letter-spacing:-.6px}
.mlc-s{font-size:13px;line-height:19px;color:var(--pc-mut);font-weight:600;font-variant-numeric:tabular-nums}
.mlc-list{display:flex;flex-direction:column;border-top:1px solid var(--pc-line);padding-top:10px}
.mlc-list span{font-size:15px;line-height:28px;color:var(--pc-ink2);overflow-wrap:anywhere}
.mlc-list span.star{color:var(--pc-ink);font-weight:750}
.mlc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;border-bottom:1px solid var(--pc-line);font-size:15px}
.mlc-row:last-child{border-bottom:none}
.mlc-row b{font-weight:700;overflow-wrap:anywhere;min-width:0}
.mlc-row span{flex-shrink:0;font-size:14px;font-weight:600;color:var(--pc-mut);font-variant-numeric:tabular-nums}
.mlc-ft{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--pc-line);padding-top:6px;margin-top:auto}
.mlc-go{min-height:44px;font-size:13.5px;font-weight:750;color:var(--pc-ink2);display:inline-flex;align-items:center;gap:2px}
.mlc-pr{font-size:24px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.mlc-seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--pc-seg)}
.mlc-seg button{flex:1;min-height:40px;border-radius:10px;font-size:13px;font-weight:750;color:var(--pc-mut)}
.mlc-seg button[aria-pressed="true"]{background:var(--pc-segon);color:var(--pc-ink);box-shadow:0 2px 8px -3px rgba(0,0,0,.2)}
.mlc.fail{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber-ink)}
.mlc.fail .mlc-k,.mlc.fail .mlc-go{color:var(--amber-ink)}
.mlc.none{background:transparent;border:1.5px dashed var(--line);box-shadow:none}
.ml-dots{display:flex;justify-content:center;gap:6px;margin-top:-8px;padding-bottom:4px}
.ml-dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .25s,background-color .25s}
.ml-dots i.on{width:18px;background:var(--ink)}
.mg-list{list-style:none;margin:0;padding:0}
.mg{display:flex;align-items:center;gap:10px;min-height:60px;border-top:1px solid var(--line);background:var(--bg)}
.mg.drag{position:relative;z-index:2;box-shadow:0 10px 24px -10px rgba(0,0,0,.35);border-radius:14px}
.mg b{flex:1;font-size:15px;font-weight:700}
.mg .grip{width:44px;height:44px;margin-left:-10px;display:flex;align-items:center;justify-content:center;color:var(--muted);touch-action:none;cursor:grab}

/* 요약 카드 (재생 화면) */
.nv{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.nv:disabled{color:var(--dis-ink);opacity:.5}
.spstack{position:relative;padding-bottom:16px}
.spstack.last{padding-bottom:0}
.sp-g1,.sp-g2{position:absolute;left:14px;right:14px;bottom:8px;height:40px;border-radius:24px;background:var(--tile);border:1px solid var(--line)}
.sp-g2{left:28px;right:28px;bottom:0;opacity:.7}
.sp{position:relative;border-radius:26px;color:#fff;padding:20px;display:flex;flex-direction:column;gap:12px;min-height:180px;box-sizing:border-box;box-shadow:0 22px 40px -24px rgba(0,0,0,.55);overflow:hidden;touch-action:pan-y;animation:spIn .4s cubic-bezier(.2,.8,.2,1) both}
.sp:after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
@keyframes spIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.sp-new{background:var(--sp-new)}.sp-due{background:var(--sp-due)}.sp-sky{background:var(--sp-sky)}.sp-ok{background:var(--sp-ok)}
.sp-kind{height:26px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12px;font-weight:800;display:inline-flex;align-items:center}
.sp-idx{font-size:12.5px;font-weight:700;opacity:.85}
.sp-t{position:relative;font-size:19px;line-height:27px;font-weight:800;letter-spacing:-.5px;overflow-wrap:anywhere}
.sp-m{position:relative;font-size:12.5px;font-weight:600;opacity:.88}
.sp-acts{position:relative;display:flex;gap:8px;margin-top:auto;padding-top:6px}
.sp-a1,.sp-a2{flex:1;height:46px;border-radius:14px;font-size:14px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.sp-a1{background:rgba(255,255,255,.16);color:#fff}
.sp-a2{background:#fff;color:#1A1417}

/* 대본 말풍선 */
.chat{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);margin:0 -18px;padding:14px 16px 0}
.cdiv{display:flex;align-items:center;gap:10px;min-height:32px;font-size:11.5px;font-weight:800;letter-spacing:1.1px;color:var(--muted);width:100%}
.cdiv:before,.cdiv:after{content:"";flex:1;height:1px;background:var(--line)}
.cmsg{display:flex;gap:10px;align-items:flex-end}
.cmsg.fut{opacity:.5}
.cav{width:40px;height:40px;border-radius:20px;background:#FDFBF4;box-shadow:0 0 0 1px var(--line);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.cav img{width:46px;height:auto;margin-top:6px}
.cnm{font-size:12px;font-weight:700;color:var(--muted);padding-left:4px}
.cbb{align-self:flex-start;padding:12px 15px;border-radius:20px 20px 20px 6px;background:var(--tile);font-size:15px;line-height:23px;color:var(--ink2);max-width:290px;box-sizing:border-box;overflow-wrap:anywhere}
.cbb.now{animation:rise .35s cubic-bezier(.2,.8,.2,1) both;background:var(--wine);color:#fff;box-shadow:0 12px 24px -14px rgba(139,30,63,.8)}
button.cbb{display:block;text-align:left;cursor:pointer;transition:opacity .3s,background-color .3s,color .3s}
.cbb.fut{color:var(--muted)}
.c-hint{font-size:12px;font-weight:600;color:var(--muted);text-align:center;margin-top:-2px}
.follow{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;height:44px;padding:0 16px 0 12px;border-radius:999px;background:var(--wine);color:#fff;font-size:13.5px;font-weight:800;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 14px 28px -12px rgba(139,30,63,.8);animation:fade .3s both}
.follow:active:not(:disabled){transform:translateX(-50%) scale(.97)}
.ctyping{align-self:flex-start;display:inline-flex;gap:4px;padding:14px 15px;border-radius:20px 20px 20px 6px;background:var(--tile)}
.ctyping i{width:6px;height:6px;border-radius:3px;background:var(--muted);animation:blink 1.2s ease-in-out infinite}
.ctyping i:nth-child(2){animation-delay:.2s}.ctyping i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:.9}}

/* 아래 메뉴바 */
.tabbar{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;height:68px;border-radius:34px;background:var(--dock);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--line);box-shadow:0 18px 40px -18px rgba(60,10,30,.45);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px;box-sizing:border-box;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.tb{border-radius:28px;color:var(--muted);font-size:11.5px;font-weight:750;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:44px}
.tb.on{background:var(--wine-soft);color:var(--wine-ink)}
.has-tabs .dock{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.has-tabs .toast{bottom:calc(176px + env(safe-area-inset-bottom,0px))}
.has-tabs .scr::after{content:"";display:block;height:88px}
/* 피드백 */
.fb-hero{position:relative;overflow:hidden;border-radius:28px;background:var(--wine);color:#fff;padding:20px;display:flex;align-items:center;gap:14px;min-height:124px;box-shadow:0 22px 44px -22px rgba(139,30,63,.6)}
.fb-hero img{width:100px;height:auto;margin:-6px -12px -48px 0;flex-shrink:0}
/* 피드백 호반우: 교류 칸 호반우(높이 140px)와 같은 크기로 보이게 한다. 그림이 여백 있는 정사각형이라 상자를 더 크게 잡는다. */
.fb-hero.fb-big{min-height:150px}
.fb-hero .fb-mascot{width:156px;height:156px;object-fit:contain;align-self:flex-end;margin:0 -18px -22px -10px}
@media(max-width:359px){.fb-hero .fb-mascot{width:124px;height:124px}}
.meet-hero{gap:8px;min-height:150px}
.meet-hero .meet-mascot{width:112px;height:140px;object-fit:contain;align-self:flex-end;margin:0 -12px -20px 0}
@media(max-width:359px){.meet-hero .meet-mascot{width:90px;height:120px}.meet-hero .fb-h{font-size:20px;line-height:28px}}
.fb-k{font-size:12.5px;font-weight:700;color:var(--on-wine-muted)}
.fb-h{margin:0;font-size:22px;line-height:30px;font-weight:800;letter-spacing:-.6px}
.fb-s{font-size:13px;color:var(--on-wine-muted)}
.fb-rate{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.fb-rt{height:64px;border-radius:18px;border:1px solid var(--line);color:var(--muted);font-size:11.5px;font-weight:750;display:grid;grid-template-rows:24px 18px;align-content:center;justify-items:center;gap:2px}
.fb-rt b{font-size:19px;font-weight:800;color:var(--ink2)}
.fb-rt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fb-rt[aria-pressed="true"] b{color:var(--bg)}
.fb-tags{display:flex;flex-wrap:wrap;gap:6px}
.fb-tg{min-height:44px;padding:0 14px;border-radius:12px;background:var(--tile);color:var(--ink2);font-size:13.5px;font-weight:700}
.fb-tg[aria-pressed="true"]{background:var(--wine-soft);color:var(--wine-ink);box-shadow:inset 0 0 0 1.5px var(--wine-ink)}
.fb-form{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px 14px 18px;border-radius:20px;background:var(--wine-soft)}
.fb-form-go{flex-shrink:0;height:44px;padding:0 16px;border-radius:14px;background:var(--wine);color:#fff;font-size:14px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.fb-thanks{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:8px 8px 0}
.fb-thanks-img{width:240px;height:240px;object-fit:contain;transform-origin:50% 100%;filter:drop-shadow(0 12px 16px rgba(0,0,0,.18));animation:fbBob 2.8s ease-in-out infinite}
@keyframes fbBob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
.fb-thanks-t{margin-top:6px;font-size:24px;line-height:32px;font-weight:800;letter-spacing:-.6px}
:root[data-theme="dark"] .fb-thanks-img{filter:drop-shadow(0 0 1px rgba(255,255,255,.45)) drop-shadow(0 12px 16px rgba(0,0,0,.4))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fb-thanks-img{filter:drop-shadow(0 0 1px rgba(255,255,255,.45)) drop-shadow(0 12px 16px rgba(0,0,0,.4))}}
.fb-ta{width:100%;box-sizing:border-box;min-height:112px;border-radius:18px;border:1.5px solid transparent;background:var(--tile);padding:14px 16px;font:inherit;font-size:15px;line-height:23px;color:var(--ink);resize:vertical;outline:none}
.fb-ta:focus{border-color:var(--wine)}

/* 사용법 안내 */
.coach{position:absolute;inset:0;z-index:30}
.ch-block{position:absolute;inset:0}
.ch-hl{position:absolute;box-shadow:0 0 0 2.5px rgba(255,255,255,.95),0 0 0 9999px rgba(12,8,10,.66);transition:left .5s cubic-bezier(.2,.8,.2,1),top .5s cubic-bezier(.2,.8,.2,1),width .5s cubic-bezier(.2,.8,.2,1),height .5s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.ch-pulse{position:absolute;inset:-2px;border-radius:inherit;animation:chPulse 1.8s ease-out infinite}
@keyframes chPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}100%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
.ch-tip{position:absolute;left:16px;right:16px;background:var(--bg);color:var(--ink);border-radius:24px;padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px;box-shadow:0 24px 50px -18px rgba(0,0,0,.6);animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
:root[data-theme="dark"] .ch-tip,:root[data-theme="dark"] .ch-arr{background:var(--tile2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ch-tip,:root:not([data-theme="light"]) .ch-arr{background:var(--tile2)}}
.ch-arr{position:absolute;width:16px;height:16px;background:var(--bg);transform:rotate(45deg);border-radius:3px}
.ch-k{font-size:11.5px;font-weight:800;letter-spacing:1.2px;color:var(--wine-ink)}
.ch-t{font-size:17px;line-height:23px;font-weight:800;letter-spacing:-.4px}
.ch-p{margin:0;font-size:14px;line-height:21px;color:var(--ink2)}
.ch-dot{display:block;width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .25s}
.ch-dot.on{width:16px;background:var(--wine)}
.ch-sk{min-height:44px;padding:0 8px;color:var(--muted);font-size:13.5px;font-weight:700}
.ch-nx{height:44px;padding:0 20px;border-radius:14px;background:var(--wine);color:#fff;font-size:14.5px;font-weight:800}
.touring .scr{overflow:hidden}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--wine);color:#fff;border-radius:30px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 22px 44px -22px rgba(139,30,63,.6)}
.hero .deco{position:absolute;left:-40px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.hero-chip{font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.14);transition:background .3s,color .3s}
.hero-chip.now{background:#fff;color:#8B1E3F}
.ringwrap{position:relative;width:80px;height:80px;flex-shrink:0}
.ringwrap svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.ring-prog{stroke-dasharray:213.6;stroke-dashoffset:213.6;transition:stroke-dashoffset .15s linear}
.playbig{position:absolute;left:10px;top:10px;width:60px;height:60px;border-radius:30px;background:#fff;color:#8B1E3F;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -8px rgba(0,0,0,.45)}
@keyframes breathe{50%{transform:scale(1.06)}}
.idle .playbig{animation:breathe 2.6s ease-in-out infinite}
.herowrap{position:relative;padding-top:46px}
.herowrap .hero{padding:20px 152px 20px 20px;min-height:184px;gap:12px;justify-content:center}
.hero-lab{font-size:13px;font-weight:700;color:var(--on-wine-muted)}
.hero-t{font-size:21px;line-height:28px;font-weight:800;letter-spacing:-.6px;overflow-wrap:anywhere}
.hero-play{align-self:flex-start;height:52px;padding:0 20px 0 14px;border-radius:26px;background:#fff;color:#8B1E3F;font-size:15px;font-weight:800;display:inline-flex;align-items:center;gap:6px;box-shadow:0 8px 20px -8px rgba(0,0,0,.45)}
.hero.off .hero-play{height:48px;background:var(--tile2);color:var(--dis-ink);box-shadow:none}
.hero-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
.hero-bar i{display:block;height:4px;background:#fff;width:0}
.hb{position:absolute;right:2px;bottom:0;width:150px;height:auto;z-index:1;pointer-events:none;transform-origin:50% 100%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.18));animation:hbIdle 3.4s ease-in-out infinite}
@keyframes hbIdle{50%{transform:translateY(-3px) rotate(-1.5deg)}}
@keyframes hbGroove{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.herowrap.playing .hb{animation:hbGroove .9s ease-in-out infinite}
.herowrap.rest .hb{filter:grayscale(1);opacity:.45;animation:none}
:root[data-theme="dark"] .herowrap:not(.rest) .hb{filter:drop-shadow(0 0 1px rgba(255,255,255,.45)) drop-shadow(0 10px 14px rgba(0,0,0,.4))}
:root[data-theme="dark"] .herowrap.rest .hb{opacity:.3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .herowrap:not(.rest) .hb{filter:drop-shadow(0 0 1px rgba(255,255,255,.45)) drop-shadow(0 10px 14px rgba(0,0,0,.4))}:root:not([data-theme="light"]) .herowrap.rest .hb{opacity:.3}}
.hero.off{background:var(--tile);color:var(--ink);border:1.5px dashed var(--line);box-shadow:none}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.enter .pop{display:inline-block;animation:pop .55s .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes sheen{from{transform:translateX(-120%)}to{transform:translateX(260%)}}
.sheen{position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sheen 2.8s 1s ease-in-out infinite;pointer-events:none}
:root[data-theme="dark"] .sheen{background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sheen{background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
.sk{background:linear-gradient(90deg,var(--sk) 25%,var(--sk-hi) 50%,var(--sk) 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1.4s linear infinite}

/* board tiles */
.btile{background:var(--tile);border-radius:24px;padding:14px 16px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;text-align:left}
.btile.hot{background:var(--wine-soft)}
.list-row{min-height:64px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%}

/* switch */
.sw{width:52px;height:32px;border-radius:16px;background:var(--tile2);position:relative;flex-shrink:0;transition:background-color .25s}
.sw i{position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:13px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .28s cubic-bezier(.3,1.4,.5,1);display:flex;align-items:center;justify-content:center;color:#8B1E3F}
.sw.on{background:var(--wine)}.sw.on i{transform:translateX(20px)}
.sw.lock{background:var(--wine-lock)}.sw.lock i{transform:translateX(20px)}
@keyframes nudge{0%,100%{transform:translateX(20px)}25%{transform:translateX(16px)}75%{transform:translateX(23px)}}
.sw.lock.shake i{animation:nudge .35s}
.field{height:52px;width:100%;padding:0 16px;border-radius:16px;border:1.5px solid transparent;background:var(--tile);font-size:16px;font-weight:600;outline:none}
.field:focus{border-color:var(--wine)}
.field.search{padding-left:44px}
.sicon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}

/* sheet */
.dim{position:absolute;inset:0;background:var(--scrim);z-index:20;animation:fade .3s both}
.sheet{position:absolute;left:0;right:0;bottom:0;top:56px;background:var(--bg);border-radius:30px 30px 0 0;z-index:21;display:flex;flex-direction:column;animation:up .5s cubic-bezier(.2,.9,.2,1) both;box-shadow:0 -10px 40px -10px rgba(0,0,0,.25)}
.sheet .body{flex:1;overflow-y:auto;padding:10px 20px 24px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none}
.sheet .body::-webkit-scrollbar{display:none}
@keyframes nudge2{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-2px)}}
.arrow{animation:nudge2 1.6s ease-in-out infinite}

/* tabs */
.seg{position:relative;height:48px;border-radius:16px;background:var(--tile);padding:4px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.seg .pill{position:absolute;left:4px;top:4px;bottom:4px;border-radius:12px;background:var(--bg);box-shadow:0 2px 8px -2px rgba(26,20,23,.18);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.seg button{position:relative;font-size:14.5px;font-weight:750;color:var(--muted);border-radius:12px}
.seg button[aria-selected="true"]{color:var(--ink)}

/* player */
.orbwrap{position:relative;width:188px;height:188px}
.orb,.orb-ring{position:absolute;inset:0;border-radius:50%;background:var(--wine)}
.orb{display:flex;align-items:center;justify-content:center;box-shadow:0 30px 60px -24px rgba(139,30,63,.75)}
.orb-ring{opacity:0}
@keyframes pulse{0%{transform:scale(.85);opacity:.5}100%{transform:scale(1.45);opacity:0}}
.playing .orb-ring{animation:pulse 2.4s cubic-bezier(.2,.6,.3,1) infinite}
.playing .orb-ring.r2{animation-delay:-1.2s}
@keyframes orbB{50%{transform:scale(1.035)}}
.playing .orb{animation:orbB 2.4s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.eq{display:flex;align-items:flex-end}
.eq i{display:block;border-radius:4px;background:#fff;transform-origin:50% 100%;transform:scaleY(.35);transition:transform .4s}
.playing .eq i{animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.25s}.eq i:nth-child(3){animation-delay:-.55s}.eq i:nth-child(4){animation-delay:-.8s}.eq i:nth-child(5){animation-delay:-.4s}
/* 진행바: 구간마다 칸이 나뉘어 있고, 아무 곳이나 누르거나 끌어서 옮긴다 */
.segs{position:relative;display:flex;align-items:center;gap:4px;height:32px;touch-action:none;cursor:pointer;border-radius:8px}
.segs .sg{display:block;height:6px;min-width:6px;border-radius:3px;background:var(--tile2);overflow:hidden}
.segs .sg i{display:block;height:6px;border-radius:3px;background:var(--wine);width:0}
.segs .knob{position:absolute;left:0;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:8px;background:var(--wine);box-shadow:0 0 0 3px var(--bg),0 4px 10px -4px rgba(0,0,0,.4);pointer-events:none;transition:transform .15s}
.segs.drag .knob{transform:scale(1.3)}
.ctl{width:56px;height:56px;border-radius:28px;background:var(--tile);display:flex;align-items:center;justify-content:center}
.ctl.ghost{width:48px;height:48px;background:transparent;color:var(--ink2)}
.ctl.main{width:80px;height:80px;border-radius:40px;background:var(--wine);color:#fff;box-shadow:0 18px 34px -16px rgba(139,30,63,.85)}
.scard{width:290px;flex-shrink:0;border:1px solid var(--line);border-radius:22px;padding:14px 14px 8px 16px;display:flex;flex-direction:column;gap:8px;background:var(--bg);scroll-snap-align:start}
@keyframes cardIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.cards{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 18px 4px;margin:0 -18px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.cards>*{animation:cardIn .45s cubic-bezier(.2,.8,.2,1) both}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sline{padding:10px 12px;border-radius:16px;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%}
.sline.cur{background:var(--wine-soft)}

/* dock */
.dock{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;border-radius:24px;background:var(--dock);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--line);box-shadow:0 16px 40px -16px rgba(60,10,30,.45);overflow:hidden;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.dock .in{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px}
.dock-x{width:44px;height:44px;border-radius:22px;margin-left:-4px;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dock .bar{height:3px;background:var(--line)}.dock .bar i{display:block;height:3px;background:var(--wine);width:0}
.toast{position:absolute;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;font-size:13.5px;line-height:20px;font-weight:600;animation:rise .35s both}
.ava{display:block;flex-shrink:0;border-radius:50%;background-color:#FDFBF4;background-repeat:no-repeat;background-size:140%;background-position:50% 14%;box-shadow:0 0 0 1px var(--line)}
/* 저장 공지와 펼쳐 보는 월 일정 */
.saved-card{border:1px solid var(--line);border-radius:22px;padding:4px 14px;display:flex;align-items:center;gap:8px}
.saved-card .list-row{flex:1;min-width:0;border:0}
.cal-more{border-top:1px solid var(--line)}
.cal-more summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:750;color:var(--wine-ink)}
.cal-more summary::-webkit-details-marker{display:none}
.cal-more summary .less,.cal-more[open] summary .more{display:none}
.cal-more[open] summary .less{display:inline}
.cal-more[open] summary svg{transform:rotate(180deg)}
/* 캘린더 */
.cal-nav{display:flex;align-items:center;justify-content:space-between;min-height:52px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px 2px;padding-bottom:6px}
.cal-wd{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0 6px}
.cal-wd.sun{color:var(--wine-ink)}
.cal-d{position:relative;height:64px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;font-weight:700}
.cal-d .dots{display:flex;gap:3px;height:5px}
.cal-d .dots i{width:5px;height:5px;border-radius:3px}
.cal-d.today{background:var(--wine-soft);color:var(--wine-ink)}
.cal-title{display:flex;align-items:center;gap:8px}
.cal-title img{width:34px;height:42px;object-fit:contain}
.cal-d.today{justify-content:flex-end;padding-bottom:8px}
.cal-hobanu{position:absolute;top:-12px;left:50%;width:36px;height:36px;object-fit:contain;transform:translateX(-50%);pointer-events:none}
:root[data-theme="dark"] .cal-hobanu,:root[data-theme="dark"] .cal-title img{filter:drop-shadow(0 0 1px rgba(255,255,255,.55))}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .cal-hobanu,:root:not([data-theme="light"]) .cal-title img{filter:drop-shadow(0 0 1px rgba(255,255,255,.55))}}
.cal-d.sel{background:var(--ink);color:var(--bg)}
.cal-d.sel .dots i{background:var(--bg)}
.ym{border:1px solid var(--line);border-radius:22px;padding:2px 16px 6px}
.ym.now{border-color:var(--wine-ink)}
.ym-h{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;font-size:16px;font-weight:800;text-align:left}
.ym .ev{font-size:14px;min-height:46px}
.meet-section{border:1px solid var(--line);border-radius:24px;overflow:hidden}
.meet-entry{display:flex;flex-direction:column;gap:12px;width:100%;padding:18px;text-align:left;background:var(--bg)}
.meet-entry:active{background:var(--tile)}
/* 과팅 (예시) */
.mt-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink);font-size:13px;line-height:19px}
.mt-card{border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.mt-card.mine{background:var(--wine-soft);border-color:transparent}
.mt-t{font-size:17px;line-height:24px;font-weight:800;letter-spacing:-.4px}
.mt-m{font-size:13px;line-height:19px;color:var(--muted);font-weight:600}
.mt-p{margin:0;font-size:14.5px;line-height:22px;color:var(--ink2);overflow-wrap:anywhere}
.mt-ft{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.mt-go{height:44px;padding:0 18px;border-radius:14px;background:var(--wine);color:#fff;font-size:14px;font-weight:800;display:inline-flex;align-items:center;gap:5px}
.mt-go.done{background:var(--tile);color:var(--ink2)}
/* KNUA 브랜드 · 시작 화면 · 구간별 호반우 (요청 5, 9, 11) */
.brand-logo{display:block;width:190px;height:auto;color:var(--wine-ink)}
.brand-dark{display:none}
:root[data-theme="dark"] .brand-light{display:none}
:root[data-theme="dark"] .brand-dark{display:block}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand-light{display:none}:root:not([data-theme="light"]) .brand-dark{display:block}}
.splash{position:absolute;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom,0px));text-align:center;isolation:isolate;transition:opacity .18s ease}
.splash[hidden]{display:none}
.splash.leaving{opacity:0;pointer-events:none}
/* 시작 화면 뒤 원: 경북대 엠블럼(공식 UI 내려받기 파일)을 테마 색으로 연하게 깐다 */
.splash::before{content:"";position:absolute;width:310px;height:310px;background:var(--wine-ink);opacity:.1;z-index:-1;top:calc(50% - 208px);-webkit-mask:url(data/branding/knu-emblem.png) center/contain no-repeat;mask:url(data/branding/knu-emblem.png) center/contain no-repeat;animation:emblemIn .9s ease-out both}
@keyframes emblemIn{from{opacity:0;transform:scale(.94)}to{opacity:.1;transform:none}}
.splash .brand-logo{width:210px}
.splash-mascot{width:210px;height:210px;object-fit:contain;animation:splashHello .75s cubic-bezier(.2,.8,.2,1) both}
.splash-copy{margin:20px 0 0;font-size:17px;line-height:26px;font-weight:750;color:var(--ink)}
.splash-name{margin:6px 0 0;font-size:12px;letter-spacing:3px;font-weight:800;color:var(--muted)}
@keyframes splashHello{0%{opacity:0;transform:translateY(28px) rotate(-8deg)}65%{opacity:1;transform:translateY(-5px) rotate(4deg)}100%{opacity:1;transform:none}}
.hob-scene{position:relative;display:block;width:100%;height:100%;flex-shrink:0}
.hob-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:hobAppear .24s ease both;filter:drop-shadow(0 2px 0 rgba(255,255,255,.5))}
.hob-img.leaving{opacity:0;animation:none;transition:opacity .2s ease}
.hob-badge{position:absolute;right:5%;top:10%;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--sky-bg);color:var(--sky-ink)}
.hob-badge:empty{display:none}
.hob-live{animation-play-state:paused;transform-origin:50% 85%}
.hob-live.moving{animation:hobSway 2.4s ease-in-out infinite}
.hob-live.moving[data-mood="meal"]{animation-name:hobBounce;animation-duration:1.8s}
.hob-live.moving[data-mood="deadline"]{animation-name:hobNudge;animation-duration:2s}
@keyframes hobAppear{from{opacity:0}to{opacity:1}}
@keyframes hobSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes hobBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hobNudge{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-3deg)}90%{transform:rotate(3deg)}}
.orbwrap.hob-orb{width:210px;height:210px}
.hob-orb .orb{inset:14px;background:var(--wine-soft);box-shadow:none}
.playing .hob-orb .orb{animation:none}
.hob-orb .orb-ring{inset:20px}
.hob-orb .hob-scene{z-index:1}
.hob-caption{font-size:12px;font-weight:750;color:var(--wine-ink);min-height:18px}
.hb.hob-scene{width:142px;height:170px;pointer-events:none}
.herowrap .hb.hob-scene{position:absolute;right:0;bottom:10px;animation:none}
.herowrap .hb.hob-scene.moving{animation:hobSway 2.4s ease-in-out infinite}
.cav.hob-scene{width:44px;height:44px;border-radius:16px;background:var(--wine-soft);overflow:hidden}
.cav.hob-scene .hob-img{width:155%;height:155%;max-width:none;left:-27.5%;top:-8%;object-fit:contain}
.cav.hob-scene .hob-badge{width:18px;height:18px;right:0;top:0}
.cav.hob-scene .hob-badge svg{width:14px;height:14px}
.dept-avatar{width:44px;height:44px;object-fit:contain;flex-shrink:0;border-radius:50%;background:var(--wine-soft)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.meet-open{display:block;width:100%;background:none;border:0;color:inherit;text-align:left;padding:0;font:inherit;cursor:pointer}.meet-open:focus-visible{outline:3px solid var(--wine);outline-offset:5px;border-radius:12px}.meet-open .mt-ft{display:flex}.meet-open .mt-t{overflow-wrap:anywhere}.sheet textarea.field{min-height:120px;height:auto;line-height:1.6}.sheet .field{max-width:100%;box-sizing:border-box}
</style>

/* 진행바 색칠과 손잡이 위치. 칸이 구간마다 나뉘어 있어 손잡이는 지금 구간 칸 안에서 움직인다. */
function paintSeek(ch, t){
  var segs = document.querySelectorAll('[data-seg]');
  for (var i = 0; i < segs.length; i++) { var k = +segs[i].getAttribute('data-seg'); segs[i].style.width = (k < ch ? 100 : k > ch ? 0 : Math.min(100, t / CH[k].est * 100)) + '%'; }

  });
  h += '<button data-act="settings" style="border:1.5px dashed var(--line);border-radius:24px;min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;color:var(--muted)">' + sz(IC.plus, 22) + '게시판 설정</button>';

/* 4-4 게시판 */

/* 4-5 글 상세 (아래에서 올라오는 창) */

  h += '</div>' + (readable ? '<div style="padding:14px 18px calc(24px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)">' + btn + '</div>' : '') + '</div>';

/* 4-6 식당 */
/* 식당 순서: 식당 관리에서 끌어 바꾼 순서(store.cafeOrder). 브라우저에만 저장한다. */
function cafeOrder(){
  var ord = Array.isArray(store.cafeOrder) ? store.cafeOrder : [];
  function rank(c){ var k = ord.indexOf(c.id); return k < 0 ? 1000 + DATA.cafes.indexOf(c) : k; }
  return DATA.cafes.slice().sort(function(a, b){ return rank(a) - rank(b); });
}
function mlChev(){ return sz(IC.chev, 16); }
function vMealCard(x, i, when){
  var c = x.c, go = '<button class="mlc-go" data-act="cafe" data-i="' + i + '">전체 메뉴' + mlChev() + '</button>';
  if (x.state === 'fail') return '<article class="mlc fail" aria-label="' + esc(c.name) + '"><div class="col" style="gap:4px"><span class="mlc-k">학식</span><b class="mlc-n">' + esc(c.name) + '</b></div><b style="font-size:16px;line-height:23px">' + when + ' 자료를 가져오지 못했습니다</b><div class="mlc-ft" style="border-color:var(--amber-line)">' + go + '</div></article>';
  var meals = [], by = {};
  (x.state === 'ok' ? c.groups || [] : []).forEach(function(g){ var k = g.label || ''; if (!by[k]) { by[k] = []; meals.push(k); } by[k].push(g); });
  if (!meals.length) return '<article class="mlc none" aria-label="' + esc(c.name) + '"><div class="col" style="gap:4px"><span class="mlc-k">학식</span><b class="mlc-n">' + esc(c.name) + '</b></div><b style="font-size:15.5px;line-height:22px;color:var(--ink2)">' + when + ' 등록된 메뉴가 없어요</b><div class="mlc-ft">' + go + '</div></article>';
  var mi = Math.min(S.mealSel[c.id] || 0, meals.length - 1), gs = by[meals[mi]];
  var hrs = gs.map(function(g){ return g.hours; }).filter(function(t, k, a){ return t && a.indexOf(t) === k; });
  var sub = [], body = '', price = null;
  if (gs.length === 1) {
    var g = gs[0], n = g.head || 0;
    if (n) sub.push(g.menu.slice(0, n).join(' '));
    body = '<div class="mlc-list">' + g.menu.slice(n).map(function(m){ return '<span' + (/★/.test(m) ? ' class="star"' : '') + '>' + esc(m) + '</span>'; }).join('') + '</div>';
    price = g.price;
  } else {
    body = '<div class="col">' + gs.slice(0, 6).map(function(g){ var n = g.head || 1; return '<div class="mlc-row"><b>' + esc(g.menu.slice(0, n).join(' ')) + '</b><span>' + (g.price != null ? won(g.price) : '') + '</span></div>'; }).join('') + '</div>';
    if (gs.length > 6) go = '<button class="mlc-go" data-act="cafe" data-i="' + i + '">메뉴 ' + (gs.length - 6) + '개 더 보기' + mlChev() + '</button>';
  }
  if (hrs.length === 1) sub.unshift(hrs[0]);

document.addEventListener('input', function(e){

  if (e.target.id === 'seek' && CH.length) {
    var step = { ArrowLeft: -5, ArrowDown: -5, ArrowRight: 5, ArrowUp: 5 }[e.key], to = e.key === 'Home' ? 0 : e.key === 'End' ? total() - 0.1 : step != null ? elapsed() + step : null;
    if (to != null) { e.preventDefault(); var dd2 = locate(Math.max(0, to)); if (dd2) { S.follow = true; seekTo(dd2.ch, dd2.t); } var kb = $('seek'); if (kb) kb.focus(); }
